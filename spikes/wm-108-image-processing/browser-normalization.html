<!doctype html>
<meta charset="utf-8" />
<title>WM-108 browser image normalization</title>
<pre id="output">Running…</pre>
<script>
  async function run() {
    const params = new URLSearchParams(location.search);
    const fixtureNames = (params.get("fixtures") ?? "")
      .split(",")
      .map((name) => name.trim())
      .filter(Boolean);
    const maxLongEdge = Number(params.get("maxLongEdge") ?? 2048);
    const maxDimension = Number(params.get("maxDimension") ?? 8000);
    const maxInputBytes = Number(
      params.get("maxInputBytes") ?? 10 * 1024 * 1024
    );
    const maxPixels = Number(params.get("maxPixels") ?? 40_000_000);
    const quality = Number(params.get("quality") ?? 0.85);
    const outputType = params.get("format") ?? "image/webp";
    const includeBytes = params.get("includeBytes") === "1";

    function canvasBlob(canvas, type, requestedQuality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => {
            if (!blob) {
              reject(new Error("Canvas encoding returned no Blob."));
            } else {
              resolve(blob);
            }
          },
          type,
          requestedQuality
        );
      });
    }

    function ascii(bytes, offset, length) {
      if (offset + length > bytes.length) return "";
      let value = "";
      for (let index = 0; index < length; index += 1) {
        value += String.fromCharCode(bytes[offset + index]);
      }
      return value;
    }

    function readUint16BE(bytes, offset) {
      return (bytes[offset] << 8) | bytes[offset + 1];
    }

    function readUint16LE(bytes, offset) {
      return bytes[offset] | (bytes[offset + 1] << 8);
    }

    function readUint24LE(bytes, offset) {
      return (
        bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16)
      );
    }

    function readUint32BE(bytes, offset) {
      return (
        bytes[offset] * 0x1000000 +
        (bytes[offset + 1] << 16) +
        (bytes[offset + 2] << 8) +
        bytes[offset + 3]
      );
    }

    function readUint32LE(bytes, offset) {
      return (
        bytes[offset] +
        (bytes[offset + 1] << 8) +
        (bytes[offset + 2] << 16) +
        bytes[offset + 3] * 0x1000000
      );
    }

    function jpegDimensions(bytes) {
      if (bytes.length < 2 || bytes[0] !== 0xff || bytes[1] !== 0xd8) {
        throw new Error("Image is not a JPEG stream.");
      }
      const sofMarkers = new Set([
        0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce,
        0xcf
      ]);
      let offset = 2;
      while (offset + 3 < bytes.length) {
        if (bytes[offset] !== 0xff) {
          throw new Error("JPEG header is malformed.");
        }
        while (bytes[offset] === 0xff) offset += 1;
        const marker = bytes[offset++];
        if (marker === 0xd9 || marker === 0xda) break;
        if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) continue;
        if (offset + 2 > bytes.length) break;
        const segmentLength = readUint16BE(bytes, offset);
        if (segmentLength < 2 || offset + segmentLength > bytes.length) break;
        if (sofMarkers.has(marker)) {
          if (segmentLength < 7) break;
          return {
            width: readUint16BE(bytes, offset + 5),
            height: readUint16BE(bytes, offset + 3)
          };
        }
        offset += segmentLength;
      }
      throw new Error("JPEG dimensions are unavailable before decode.");
    }

    function pngDimensions(bytes) {
      const signature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
      if (
        bytes.length < 24 ||
        !signature.every((byte, index) => bytes[index] === byte) ||
        ascii(bytes, 12, 4) !== "IHDR"
      ) {
        throw new Error("Image is not a PNG stream.");
      }
      return {
        width: readUint32BE(bytes, 16),
        height: readUint32BE(bytes, 20)
      };
    }

    function webpDimensions(bytes) {
      if (
        bytes.length < 16 ||
        ascii(bytes, 0, 4) !== "RIFF" ||
        ascii(bytes, 8, 4) !== "WEBP"
      ) {
        throw new Error("Image is not a WebP stream.");
      }
      let offset = 12;
      while (offset + 8 <= bytes.length) {
        const chunkType = ascii(bytes, offset, 4);
        const chunkSize = readUint32LE(bytes, offset + 4);
        const data = offset + 8;
        if (data + chunkSize > bytes.length) break;
        if (chunkType === "VP8X" && chunkSize >= 10) {
          return {
            width: 1 + readUint24LE(bytes, data + 4),
            height: 1 + readUint24LE(bytes, data + 7)
          };
        }
        if (
          chunkType === "VP8 " &&
          chunkSize >= 10 &&
          bytes[data + 3] === 0x9d &&
          bytes[data + 4] === 0x01 &&
          bytes[data + 5] === 0x2a
        ) {
          return {
            width: readUint16LE(bytes, data + 6) & 0x3fff,
            height: readUint16LE(bytes, data + 8) & 0x3fff
          };
        }
        if (chunkType === "VP8L" && chunkSize >= 5 && bytes[data] === 0x2f) {
          return {
            width: 1 + ((bytes[data + 1] | (bytes[data + 2] << 8)) & 0x3fff),
            height:
              1 +
              (((bytes[data + 2] >> 6) |
                (bytes[data + 3] << 2) |
                (bytes[data + 4] << 10)) &
                0x3fff)
          };
        }
        offset = data + chunkSize + (chunkSize % 2);
      }
      throw new Error("WebP dimensions are unavailable before decode.");
    }

    function headerDimensions(bytes) {
      if (bytes.length >= 12 && ascii(bytes, 0, 4) === "RIFF") {
        return webpDimensions(bytes);
      }
      if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50) {
        return pngDimensions(bytes);
      }
      return jpegDimensions(bytes);
    }

    function assertSafeDimensions({ width, height }, label) {
      if (!Number.isInteger(width) || !Number.isInteger(height)) {
        throw new Error(`${label} dimensions are not integers.`);
      }
      if (width <= 0 || height <= 0) {
        throw new Error(`${label} dimensions must be positive.`);
      }
      if (width > maxDimension || height > maxDimension) {
        throw new Error(
          `${label} dimensions exceed ${maxDimension}px (${width}×${height}).`
        );
      }
      if (width > Math.floor(maxPixels / height)) {
        throw new Error(
          `${label} pixel count exceeds ${maxPixels} pixels (${width}×${height}).`
        );
      }
    }

    function colourName(data) {
      const [red, green, blue, alpha] = data;
      if (alpha < 32) return "transparent";
      if (red > 180 && green < 110 && blue < 110) return "red";
      if (green > 80 && green > red * 1.5 && green > blue * 1.5) return "green";
      if (blue > 140 && red < 120 && green < 150) return "blue";
      if (red > 160 && green > 150 && blue < 120) return "yellow";
      return `rgba(${red},${green},${blue},${alpha})`;
    }

    async function inspectPixels(blob, width, height) {
      const bitmap = await createImageBitmap(blob);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      if (!context) throw new Error("2D canvas context is unavailable.");
      context.drawImage(bitmap, 0, 0, width, height);
      bitmap.close();

      const sample = (x, y) =>
        Array.from(context.getImageData(x, y, 1, 1).data);
      const center = sample(Math.floor(width / 2), Math.floor(height / 2));
      return {
        topLeft: colourName(
          sample(Math.floor(width * 0.25), Math.floor(height * 0.25))
        ),
        topRight: colourName(
          sample(Math.floor(width * 0.75), Math.floor(height * 0.25))
        ),
        bottomLeft: colourName(
          sample(Math.floor(width * 0.25), Math.floor(height * 0.75))
        ),
        bottomRight: colourName(
          sample(Math.floor(width * 0.75), Math.floor(height * 0.75))
        ),
        centerAlpha: center[3],
        cornerAlpha: sample(1, 1)[3]
      };
    }

    async function normalizeFixture(name) {
      const response = await fetch(`/fixtures/${encodeURIComponent(name)}`);
      if (!response.ok)
        throw new Error(`Fixture request failed: ${response.status}`);
      const inputBytes = await response.arrayBuffer();
      const inputType =
        response.headers.get("content-type") ?? "application/octet-stream";
      const source = new Blob([inputBytes], { type: inputType });
      const startedAt = performance.now();

      try {
        if (inputBytes.byteLength > maxInputBytes) {
          throw new Error(
            `Input exceeds ${maxInputBytes} bytes before image decode.`
          );
        }
        const header = headerDimensions(new Uint8Array(inputBytes));
        assertSafeDimensions(header, "Header");
        const bitmap = await createImageBitmap(source, {
          imageOrientation: "from-image",
          premultiplyAlpha: "default"
        });
        const decodedWidth = bitmap.width;
        const decodedHeight = bitmap.height;
        try {
          assertSafeDimensions(
            { width: decodedWidth, height: decodedHeight },
            "Decoded"
          );
        } catch (error) {
          bitmap.close();
          throw error;
        }
        const scale = Math.min(
          1,
          maxLongEdge / Math.max(decodedWidth, decodedHeight)
        );
        const outputWidth = Math.max(1, Math.round(decodedWidth * scale));
        const outputHeight = Math.max(1, Math.round(decodedHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = outputWidth;
        canvas.height = outputHeight;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("2D canvas context is unavailable.");
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.drawImage(bitmap, 0, 0, outputWidth, outputHeight);
        bitmap.close();

        const output = await canvasBlob(canvas, outputType, quality);
        if (output.type !== outputType) {
          throw new Error(
            `${outputType} encoding is unavailable; browser returned ${output.type}.`
          );
        }
        const outputPixels = await inspectPixels(
          output,
          outputWidth,
          outputHeight
        );
        const result = {
          name,
          accepted: true,
          inputType,
          inputBytes: inputBytes.byteLength,
          decodedWidth,
          decodedHeight,
          outputType: output.type,
          outputBytes: output.size,
          outputWidth,
          outputHeight,
          processingMs: Number((performance.now() - startedAt).toFixed(1)),
          outputPixels
        };
        if (includeBytes) {
          const bytes = new Uint8Array(await output.arrayBuffer());
          let binary = "";
          for (const byte of bytes) binary += String.fromCharCode(byte);
          result.outputBase64 = btoa(binary);
        }
        return result;
      } catch (error) {
        return {
          name,
          accepted: false,
          inputType,
          inputBytes: inputBytes.byteLength,
          processingMs: Number((performance.now() - startedAt).toFixed(1)),
          error: error instanceof Error ? error.message : String(error)
        };
      }
    }

    const results = [];
    for (const name of fixtureNames) results.push(await normalizeFixture(name));
    const report = {
      browser: navigator.userAgent,
      api: {
        createImageBitmap: typeof createImageBitmap === "function",
        canvasToBlob:
          typeof document.createElement("canvas").toBlob === "function",
        webpEncoding: document
          .createElement("canvas")
          .toDataURL("image/webp")
          .startsWith("data:image/webp")
      },
      maxLongEdge,
      maxDimension,
      maxInputBytes,
      maxPixels,
      outputType,
      quality,
      results
    };
    document.getElementById("output").textContent = JSON.stringify(
      report,
      null,
      2
    );
    window.__WM108_REPORT__ = report;
  }

  run().catch((error) => {
    const report = {
      browser: navigator.userAgent,
      results: [
        {
          accepted: false,
          error: error instanceof Error ? error.message : String(error)
        }
      ]
    };
    document.getElementById("output").textContent = JSON.stringify(
      report,
      null,
      2
    );
    window.__WM108_REPORT__ = report;
  });
</script>
