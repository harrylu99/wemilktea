name: Validate WM-115 Moments limits

on:
  push:
    branches:
      - feature/wm-115-moments-hardening
    paths:
      - .github/workflows/wm115-db-validation.yml
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/tests/community_moments_workflow.sql
      - supabase/tests/community_moments_upload_workflow.sql
      - supabase/tests/community_moments_write_limits.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wm115-db-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WM-115 on isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the validation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0

      - name: Record safe validation identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "WORKFLOW_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          supabase --version

      - name: Preflight Docker runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker version --format 'Docker client: {{.Client.Version}}; Docker server: {{.Server.Version}}'
          docker info --format 'Docker server reachable: yes; memory bytes: {{.MemTotal}}; containers: {{.Containers}}'

      - name: Install PostgreSQL client if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          excluded_services="realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor"
          supabase start --exclude "$excluded_services"
          supabase status -o env > "$RUNNER_TEMP/wm115-supabase-status.env"
          chmod 600 "$RUNNER_TEMP/wm115-supabase-status.env"

          source "$RUNNER_TEMP/wm115-supabase-status.env"
          test -n "${DB_URL:-}"
          echo "Local Supabase started for commit $GITHUB_SHA"

      - name: Run WM-107, WM-109, and WM-115 SQL workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/wm115-supabase-status.env"
          SUPABASE_TELEMETRY_DISABLED=1 supabase test db --local \
            supabase/tests/community_moments_workflow.sql \
            supabase/tests/community_moments_upload_workflow.sql \
            supabase/tests/community_moments_write_limits.sql

      - name: Run strict public-schema database lint
        shell: bash
        run: |
          set -Eeuo pipefail
          SUPABASE_TELEMETRY_DISABLED=1 supabase db lint --local --schema public --fail-on error

      - name: Prove quota races with separate database sessions
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/wm115-supabase-status.env"

          draft_owner='11111111-1111-4111-8111-111111111111'
          upload_owner='22222222-2222-4222-8222-222222222222'
          draft_log_a="$RUNNER_TEMP/wm115-draft-a.log"
          draft_log_b="$RUNNER_TEMP/wm115-draft-b.log"
          upload_log_a="$RUNNER_TEMP/wm115-upload-a.log"
          upload_log_b="$RUNNER_TEMP/wm115-upload-b.log"

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<SQL
          insert into auth.users (instance_id, id, aud, role, email, encrypted_password, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '$draft_owner', 'authenticated', 'authenticated', 'wm115-race-draft@example.test', 'unused', '{}'::jsonb, '{}'::jsonb, now(), now()),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '$upload_owner', 'authenticated', 'authenticated', 'wm115-race-upload@example.test', 'unused', '{}'::jsonb, '{}'::jsonb, now(), now());

          insert into public.community_posts (owner_user_id, caption, deleted_at)
          select '$draft_owner', 'WM-115 concurrent draft seed', now()
          from generate_series(1, 3);

          insert into public.community_posts (owner_user_id, caption)
          values ('$upload_owner', 'WM-115 concurrent upload target');

          insert into private.community_post_upload_authorizations (owner_user_id, post_id)
          select '$upload_owner', id
          from public.community_posts
          cross join generate_series(1, 2)
          where owner_user_id = '$upload_owner';
          SQL

          draft_sql="begin; set local role authenticated; select set_config('request.jwt.claim.sub', '$draft_owner', true); select pg_sleep(1); select public.create_community_post_draft('WM-115 concurrent draft'); commit;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$draft_sql" > "$draft_log_a" 2>&1 & draft_pid_a=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$draft_sql" > "$draft_log_b" 2>&1 & draft_pid_b=$!

          set +e
          wait "$draft_pid_a"
          draft_status_a=$?
          wait "$draft_pid_b"
          draft_status_b=$?
          set -e

          if ! { [[ "$draft_status_a" == 0 && "$draft_status_b" != 0 ]] || [[ "$draft_status_a" != 0 && "$draft_status_b" == 0 ]]; }; then
            echo "Expected exactly one concurrent draft transaction to succeed; statuses: $draft_status_a, $draft_status_b"
            cat "$draft_log_a" "$draft_log_b"
            exit 1
          fi

          draft_count="$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -c "select count(*) from public.community_posts where owner_user_id = '$draft_owner' and created_at >= now() - interval '1 hour';")"
          if [[ "$draft_count" != 4 ]]; then
            echo "Expected four hourly draft rows after the race; found $draft_count"
            cat "$draft_log_a" "$draft_log_b"
            exit 1
          fi

          upload_post_id="$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -c "select id from public.community_posts where owner_user_id = '$upload_owner' limit 1;")"
          upload_sql="begin; set local role authenticated; select set_config('request.jwt.claim.sub', '$upload_owner', true); select pg_sleep(1); select public.consume_community_image_upload_authorization('$upload_post_id'); commit;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$upload_sql" > "$upload_log_a" 2>&1 & upload_pid_a=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$upload_sql" > "$upload_log_b" 2>&1 & upload_pid_b=$!

          set +e
          wait "$upload_pid_a"
          upload_status_a=$?
          wait "$upload_pid_b"
          upload_status_b=$?
          set -e

          if ! { [[ "$upload_status_a" == 0 && "$upload_status_b" != 0 ]] || [[ "$upload_status_a" != 0 && "$upload_status_b" == 0 ]]; }; then
            echo "Expected exactly one concurrent upload authorization to succeed; statuses: $upload_status_a, $upload_status_b"
            cat "$upload_log_a" "$upload_log_b"
            exit 1
          fi

          upload_count="$(psql "$DB_URL" -At -v ON_ERROR_STOP=1 -c "select count(*) from private.community_post_upload_authorizations where owner_user_id = '$upload_owner' and post_id = '$upload_post_id';")"
          if [[ "$upload_count" != 3 ]]; then
            echo "Expected three per-post upload authorizations after the race; found $upload_count"
            cat "$upload_log_a" "$upload_log_b"
            exit 1
          fi

          echo "WM115_CONCURRENT_DRAFT_QUOTA=PASS"
          echo "WM115_CONCURRENT_UPLOAD_QUOTA=PASS"

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase stop --no-backup
