name: Validate WM-107 Community Database

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wm-107-community-validation.yml
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/tests/community_moments_workflow.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wm107-community-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WM-107 on local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          SUPABASE_TELEMETRY_DISABLED=1 supabase start --exclude "realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor"

      - name: Run WM-107 community workflow test
        shell: bash
        run: |
          set -Eeuo pipefail
          SUPABASE_TELEMETRY_DISABLED=1 supabase test db --local supabase/tests/community_moments_workflow.sql

      - name: Run Supabase public schema lint
        shell: bash
        run: |
          set -Eeuo pipefail
          SUPABASE_TELEMETRY_DISABLED=1 supabase db lint --local --schema public --fail-on error

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          SUPABASE_TELEMETRY_DISABLED=1 supabase stop --no-backup
